<!doctype html>
<html lang="ne" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FF9F1C" />
    <meta name="description" content="कौसी चिया — Smart Cafe Management System" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/pwa/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>कौसी चिया</title>

    <style>
      /*
       * ── ZOOM LOCK ────────────────────────────────────────────────────────
       * Strategy: wrap the entire app in #zoom-wrap and apply an inverse
       * CSS `zoom` value equal to 1/devicePixelRatio-delta.
       *
       * SCROLL ARCHITECTURE:
       *   • html + body must be able to scroll — Lenis attaches to window.
       *   • #zoom-wrap must NOT create its own scroll container (no overflow:auto).
       *   • overflow:hidden on html/body would trap scroll inside zoom-wrap
       *     and make Lenis blind to all touch events on mobile.
       * ─────────────────────────────────────────────────────────────────────
       */
      *, *::before, *::after { box-sizing: border-box; }

      html {
        margin: 0;
        padding: 0;
        width: 100%;
        /* Let html scroll — Lenis needs window to be the scroll host */
        height: 100%;
        overflow-x: hidden;
      }

      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
      }

      #zoom-wrap {
        width: 100%;
        min-height: 100%;
        /* Smooth zoom animation — fires when JS sets the zoom property */
        transition: zoom 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        transform-origin: top left;
        /*
         * ⚠️  NO overflow:auto here.
         * overflow:auto would make #zoom-wrap the scroll container,
         * which breaks Lenis (it listens on window, not this div).
         * Lenis + globals.css handle scroll via html.lenis rules.
         */
      }

      #root {
        width: 100%;
        min-height: 100dvh;
      }
    </style>
  </head>

  <body>
    <!--
      #zoom-wrap sits between <body> and <div id="root">.
      The zoom lock script sets zoom: 0.8 (for example) here,
      which shrinks the entire app uniformly — no clipping, no offsets.
    -->
    <div id="zoom-wrap">
      <div id="root"></div>
    </div>

    <!--
      Zoom-lock script — runs synchronously before React mounts.
      Sets the initial zoom immediately so there is ZERO layout flash.
    -->
    <script>
      (function () {
        var wrap     = document.getElementById('zoom-wrap')
        var rafId    = null
        var lastZoom = -1          // force first apply
        var baseDPR  = window.devicePixelRatio || 1  // DPR at page load (= zoom 100%)

        function getZoomLevel() {
          var dpr = window.devicePixelRatio || 1
          var zoom = dpr / baseDPR
          return Math.round(zoom * 20) / 20
        }

        function applyZoom() {
          var zoomLevel   = getZoomLevel()
          var counterZoom = 1 / zoomLevel

          if (Math.abs(counterZoom - lastZoom) < 0.005) return
          lastZoom = counterZoom

          wrap.style.zoom = counterZoom

          // At counter-zoom 0.8 the wrap needs to be 125% wide/tall
          // so it fills the full viewport after scaling
          var pct = (zoomLevel * 100).toFixed(1) + '%'
          wrap.style.width  = pct
          // ⚠️  height → minHeight so content can grow beyond viewport
          wrap.style.minHeight = pct
        }

        function onResize() {
          if (rafId) cancelAnimationFrame(rafId)
          rafId = requestAnimationFrame(applyZoom)
        }

        applyZoom()

        window.addEventListener('resize', onResize, { passive: true })

        if (window.matchMedia) {
          var dprMql = null

          function watchDPR() {
            if (dprMql) dprMql.removeEventListener('change', onDPRChange)
            dprMql = window.matchMedia(
              '(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)'
            )
            dprMql.addEventListener('change', onDPRChange)
          }

          function onDPRChange() {
            onResize()
            watchDPR()
          }

          watchDPR()
        }
      })()
    </script>

    <script type="module" src="/src/app/main.jsx"></script>
  </body>
</html>
